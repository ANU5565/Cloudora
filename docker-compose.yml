version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cloudora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudora_user
      POSTGRES_PASSWORD: cloudora_secure_password_change_in_prod
      POSTGRES_DB: cloudora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudora_user -d cloudora"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudora_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_NAME: Cloudora
      APP_URL: http://localhost:8000
      FRONTEND_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      DATABASE_URL: postgresql://cloudora_user:cloudora_secure_password_change_in_prod@db:5432/cloudora
      JWT_SECRET_KEY: change-this-to-a-very-long-and-secure-random-secret-key
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage_data
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudora_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_storage:
